repos:
  # Black - 코드 포맷터
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # isort - import 정렬
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # flake8 - 린터
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [
          "--max-line-length=88",
          "--extend-ignore=E203,W503",
        ]

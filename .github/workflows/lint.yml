name: Auto Format & Push

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**/*.py'

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install formatting tools
      run: |
        pip install black isort flake8 autoflake

    - name: Remove unused imports
      run: |
        cd backend
        autoflake --remove-all-unused-imports --in-place --recursive app/

    - name: Run isort
      run: |
        cd backend
        isort .

    - name: Run Black
      run: |
        cd backend
        black .

    - name: Check for changes
      id: verify_diff
      run: |
        git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.verify_diff.outputs.changed == 'true'
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add -A
        git commit -m "style: Auto-format code [skip ci]"
        git push

    - name: Run flake8 (check only)
      run: |
        cd backend
        flake8 . --extend-ignore=E501,F401,F403,F405 --max-line-length=88 || true

name: Code Quality Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**/*.py'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tools
      run: |
        pip install black isort flake8

    - name: Check Black formatting
      run: |
        cd backend
        black --check --diff . || true

    - name: Check isort
      run: |
        cd backend
        isort --check-only --diff . || true

    - name: Run flake8
      run: |
        cd backend
        flake8 . --extend-ignore=E501,F401,F403,F405 --max-line-length=88 || true
